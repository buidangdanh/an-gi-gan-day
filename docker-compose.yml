name: an-gi-gan-day
services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: angiday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
      POSTGRES_DB: angiday
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["food_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U angiday -d angiday"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  food_db:
